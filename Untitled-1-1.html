<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice of the Streets | Petition</title>
    <style>
        body {
            background-color: #0a0a0a; /* Deep Black */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Concert Lighting Effect */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1459749411177-042180ce673c?auto=format&fit=crop&q=80&w=1000'); /* Concert Crowd Background */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 -100px 100px #0a0a0a;
        }

        .neon-text {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            margin-bottom: 10px;
        }

        .counter-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid #00d4ff;
            font-size: 1.5rem;
            margin: 20px;
        }

        .form-container {
            max-width: 600px;
            margin: -50px auto 50px;
            padding: 40px;
            background: #1a1a1a;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label { display: block; margin-bottom: 8px; color: #00d4ff; }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #00d4ff;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #008fb3;
            box-shadow: 0 0 20px #00d4ff;
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1 class="neon-text">SAVE OUR LOCAL GIGS!</h1>
        <p>Community Petition to keep the city's music alive.</p>
        <div class="counter-box">
            Current Signatures: <strong>1,248</strong>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2 style="text-align: center; color: #fff;">Join the Movement</h2>
            <form id="petitionForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="comment">Why is this important to you? (Optional)</label>
                    <textarea id="comment" rows="4" placeholder="Share your thoughts..."></textarea>
                </div>
                <button type="submit">SIGN THIS PETITION</button>
            </form>
        </div>
    </main>

    <footer style="text-align: center; padding: 20px; color: #666;">
        &copy; 2026 Voice of the Streets | Built with HTML & Semantic Design
    </footer>

</body>
</html>
